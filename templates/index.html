<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Mahasiswa Modern</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <header>
            <h1>🎓 Student Data Manager</h1>
            <p>Kelola data mahasiswa dengan mudah & cepat.</p>
        </header>

        <section class="card input-section">
            <h2>Tambah Data Baru</h2>
            <form id="formMahasiswa">
                <div class="form-group">
                    <input type="text" id="nim" placeholder="NIM" required pattern="\d{3,}" title="Minimal 3 angka">
                </div>
                <div class="form-group">
                    <input type="text" id="nama" placeholder="Nama Lengkap" required>
                </div>
                <div class="form-group">
                    <input type="text" id="jurusan" placeholder="Jurusan" required>
                </div>
                <div class="form-group">
                    <input type="number" id="ipk" placeholder="IPK (0.00 - 4.00)" step="0.01" min="0" max="4" required>
                </div>
                <button type="submit" class="btn-primary">Simpan Data</button>
            </form>
        </section>

        <section class="card list-section">
            <div class="list-header">
                <h2>Daftar Mahasiswa</h2>
                <button onclick="loadData()" class="btn-refresh">🔄 Refresh</button>
            </div>
            
            <div class="table-responsive">
                <table id="tabelMahasiswa">
                    <thead>
                        <tr>
                            <th>NIM</th>
                            <th>Nama</th>
                            <th>Jurusan</th>
                            <th>IPK</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
